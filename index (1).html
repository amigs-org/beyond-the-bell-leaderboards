.lb .pod .p1 .ped{height:7.5em;animation:gl 3.2s ease-in-out infinite}.lb .pod .p2 .ped{height:5.2em}.lb .pod .p3 .ped{height:3.7em}@keyframes gl{50%{filter:brightness(1.2)}}@media(prefers-reduced-motion:reduce){.lb .pod .p1 .ped{animation:none}}

.lb .none{opacity:.6;padding:2em;text-align:center}`;

const PRE={minimalist:['#ffffff','#ffffff','#111111','#111111','#2563eb','#f5f5f5','#e5e5e5','sans',10],'modern dark':['#0b0d12','#12162a','#eef0ff','#8b7bff','#22d3ee','#161a28','#252b3d','sans',14],'premium gold':['#14110a','#241c0c','#f5e6c0','#d4af37','#f0c75e','#1e1a10','#3a3118','serif',6],neon:['#05050f','#150a33','#ffffff','#ff2bd6','#00f0ff','#0d0d24','#3a1a8c','mono',4],academic:['#f7f3e8','#efe7d2','#2b2a33','#7b1e2b','#1e4d8c','#fffdf6','#d8cfb8','serif',4],sport:['#0a3d1f','#0f5a2c','#ffffff','#ffd400','#ff6a00','#0f5228','#1b7a3f','bold',8],corporate:['#f1f5f9','#e2e8f0','#0f172a','#1d4ed8','#0891b2','#ffffff','#cbd5e1','sans',8],glassmorphism:['#4f46e5','#ec4899','#ffffff','#ffffff','#fde68a','#ffffff','#ffffff','round',18],gradient:['#ff7e5f','#6a11cb','#ffffff','#ffffff','#ffe66d','#ffffff','#ffffff','sans',16],editorial:['#fbfaf7','#fbfaf7','#111111','#e11d48','#111111','#ffffff','#111111','serif',0]};

function pre(s,n){const p=PRE[n];Object.assign(s,{theme:n,bg:p[0],bg2:p[1],fg:p[2],pri:p[3],acc:p[4],row:p[5],bd:p[6],font:p[7],rad:p[8],ra:n==='glassmorphism'?.18:n==='gradient'?.14:1,bl:n==='glassmorphism'?10:0,g1:'#f5b301',g2:'#aab4c3',g3:'#cd7f32'});return s}

  const a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',blankrows:false}),H=findHeader(a);

const fromDB=r=>({id:String(r.id),name:String(r.student_name??''),score:+r.full_year||0,cat:r.year_group==null?'':'Year '+r.year_group,yg:r.year_group,img:'',x:{HT2:r.ht2,HT3:r.ht3,HT4:r.ht4,HT5:r.ht5,HT6:r.ht6}});
async function loadRows(){const all=[];let total=null;for(;;){const{data,error,count}=await sb.from('student_points').select(COLS,{count:'exact'}).order('id').range(all.length,all.length+999);if(error)throw error;if(total===null)total=count==null?-1:count;all.push(...data);if(!data.length||(total>=0&&all.length>=total))break}return all.map(fromDB)}
async function loadAll(){const[st,rows]=await Promise.all([sb.from('rankforge_settings').select('settings').eq('id','global').maybeSingle(),loadRows()]);if(st.error)throw st.error;
 const s=cleanS(st.data?.settings);if(!st.data)s.title='Leaderboard';lastJ=JSON.stringify(s);
 S.boards=[{id:'global',name:'Leaderboard',created:Date.now(),modified:Date.now(),fav:0,rows,_rj:JSON.stringify(rows),extra:['HT2','HT3','HT4','HT5','HT6'],s}]}
function setStat(t,c){const e=$('#sv');if(e){e.textContent=t;e.style.color=c||'var(--m)'}}
function queueSet(){const b=gb();if(!ADM||!sb||!b||JSON.stringify(b.s)===lastJ)return;dirty=true;setStat('Unsaved changes\u2026');clearTimeout(sT);sT=setTimeout(saveSet,1500)}
async function saveSet(){if(!ADM||!sb)return;clearTimeout(sT);const b=gb();if(!b)return;setStat('Saving\u2026');
 try{const{data}=await sb.auth.getSession(),uid=data?.session?.user?.id,snap=JSON.stringify(b.s);
  const{error}=await sb.from('rankforge_settings').upsert({id:'global',settings:cleanS(b.s),updated_at:new Date().toISOString(),updated_by:uid},{onConflict:'id'});if(error)throw error;
  lastJ=snap;dirty=JSON.stringify(b.s)!==snap;lastSave=Date.now();setStat('Saved \u2713 '+new Date().toLocaleTimeString('en-GB'),'#16a34a');toast('Design saved for all viewers')}
 catch(e){setStat('Save failed','#dc2626');toast('Could not save design: '+(e.message||'permission denied'));recheck()}}
async function recheck(){try{const{data}=await sb.rpc('rankforge_is_admin');if(data!==true&&ADM){ADM=false;V.v='view';render()}}catch(e){}}
const scrub=s=>String(s??'').replace(/eyJ[\w-]{8,}\.[\w-]+\.[\w-]*/g,'[token]').replace(/sb_(publishable|secret)_[\w-]+/g,'[key]').replace(/Bearer\s+\S+/gi,'Bearer [redacted]');
const dbg=(m,st,err)=>{try{console.warn('[RankForge] '+m,st??'',err?{name:err.name||'',message:scrub(err.message||err)}:'')}catch(e){}};
let SEP=0,RT='',rtLive=false,rtFailed=false,PT=null,PIF=false,PFAIL=0,PEP=0;
const RTL={live:['Live updates connected','#22c55e'],poll:['Using automatic updates','#f59e0b'],recon:['Reconnecting\u2026','#f59e0b'],down:['Updates temporarily unavailable','#ef4444']};
function setRT(s){if(RT===s)return;RT=s;let e=$('#rtchip');if(!s||!SES){RT=s||'';if(e)e.remove();return}
 if(!e){e=document.createElement('div');e.id='rtchip';document.body.appendChild(e)}e.textContent='';const d=document.createElement('i');d.style.background=RTL[s][1];e.appendChild(d);e.appendChild(document.createTextNode(RTL[s][0]))}
function rtOK(){rtLive=true;stopPoll();PFAIL=0;setRT('live');console.info('[RankForge] Realtime status: SUBSCRIBED');if(rtFailed){rtFailed=false;pollOnce()}}
function rtFail(st,err){if(!SES)return;rtLive=false;rtFailed=true;dbg('Realtime status: '+st,'',err);if(RT===''||RT==='live')setRT('recon');startPoll()}
async function subscribe(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session||!session.access_token){dbg('Realtime not started: no session');return}
 await sb.realtime.setAuth(session.access_token);
 if(GCH){const old=GCH;GCH=null;try{await sb.removeChannel(old)}catch(e){dbg('removeChannel failed','',e)}}
 const ch=sb.channel('rankforge-live');GCH=ch;
 ch.on('postgres_changes',{event:'*',schema:'public',table:'rankforge_settings'},onSet).on('postgres_changes',{event:'*',schema:'public',table:'student_points'},rowsSoon).subscribe((status,err)=>{
  if(GCH!==ch||!SES)return;
  if(status==='SUBSCRIBED')return rtOK();
  if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')rtFail(status,err)})}
function onSet(p){if(p.eventType==='DELETE'||!p.new?.settings)return;applySettings(p.new.settings)}
function applySettings(raw){const b=gb();if(!b||!raw)return;if(ADM&&(dirty||Date.now()-lastSave<4000||JSON.stringify(b.s)!==lastJ))return;
 const s=cleanS(raw),j=JSON.stringify(s);if(j===JSON.stringify(b.s))return;b.s=s;lastJ=j;
 if(V.pres)presUpdate();else if(!ADM)vpaint(true);else render()}
function applyRows(rows){const b=gb();if(!b||!rows)return;const j=JSON.stringify(rows);if(j===b._rj)return;
 if(ADM&&JSON.stringify(b.rows)!==b._rj)return;
 const ids=b.rows.map(r=>r.id).join();b.rows=rows;b._rj=j;
 if(V.pres)presUpdate();else if(!ADM)vpaint(true);else if(V.v==='editor'){if(ids!==rows.map(r=>r.id).join()){render()}else{pv(1);syncInputs(b)}}else if(V.v==='import')render()}
async function refreshNow(){if(!sb||!SES)return;const ep=SEP,rows=await loadRows();if(ep!==SEP||!SES)return;applyRows(rows)}
const ptab=b=>{const q=V.q.toLowerCase(),L=b.rows.filter(r=>(!q||r.name.toLowerCase().includes(q))&&(!V.cat||r.cat===V.cat));
 return `<tr><th>Name</th><th>Yr</th>${HTN.map(k=>`<th>${k}</th>`).join('')}<th>Full</th><th></th></tr>`+L.slice(0,200).map(r=>`<tr><td style="white-space:nowrap">${esc(r.name)}</td><td>${r.yg??''}</td>${HTN.map(k=>`<td><input type="number" step="1" data-ht="${r.id}|${k}" value="${r.x[k]??0}" style="width:46px"></td>`).join('')}<td data-fy="${r.id}"><b>${r.score}</b></td><td><button class="btn s" data-a="delrow:${r.id}">\u00d7</button></td></tr>`).join('')+(L.length>200?`<tr><td colspan="9">Showing 200 of ${L.length}. Use search.</td></tr>`:'')};
const ptabR=()=>{const e=$('#ptab'),b=gb();if(e&&b)e.innerHTML=ptab(b)};
function syncInputs(b){const m=new Map(b.rows.map(r=>[r.id,r]));document.querySelectorAll('[data-ht]').forEach(i=>{if(document.activeElement===i)return;const[id,k]=i.dataset.ht.split('|'),r=m.get(id);if(r)i.value=r.x[k]??0});document.querySelectorAll('[data-fy]').forEach(c=>{const r=m.get(c.dataset.fy);if(r)c.innerHTML='<b>'+r.score+'</b>'})}
async function htEdit(t){if(!ADM||!sb)return;const[id,k]=String(t.dataset.ht).split('|'),b=gb(),r=b&&b.rows.find(x=>x.id===id);if(!r)return;
 const col=k.toLowerCase(),old=r.x[k],tv=String(t.value).trim(),v=tv===''?0:Number(tv);
 if(!Number.isInteger(v)||Math.abs(v)>100000){t.value=old;return toast('Enter a whole number')}
 if(v===old)return;t.disabled=true;
 try{let q=sb.from('student_points').update({[col]:v}).eq('id',Number(id));q=old==null?q.is(col,null):q.eq(col,old);
  const{data,error}=await q.select(COLS);if(error)throw error;
  if(!data||data.length!==1){t.value=old;await refreshNow();return toast('Not saved: the value was changed elsewhere or you lack permission. Latest data reloaded.')}
  const n=fromDB(data[0]),i=b.rows.indexOf(r);if(i>=0)b.rows[i]=n;b._rj=JSON.stringify(b.rows);t.value=n.x[k];
  const c=document.querySelector('[data-fy="'+id+'"]');if(c)c.innerHTML='<b>'+n.score+'</b>';pv(1);toast('Saved')}
 catch(e){t.value=old;toast('Could not save: '+emsg(e))}finally{t.disabled=false}}
async function delRow(id){if(!ADM||!sb)return;const b=gb(),r=b&&b.rows.find(x=>x.id===id);if(!r)return;if(!confirm('Permanently delete '+r.name+' ('+r.cat+')?'))return;
 try{const{data,error}=await sb.from('student_points').delete().eq('id',Number(id)).select('id');if(error)throw error;
  if(!data||data.length!==1){await refreshNow();return toast('Not deleted: the record was already removed or you lack permission. Reloaded.')}
  b.rows=b.rows.filter(x=>x.id!==id);b._rj=JSON.stringify(b.rows);render();toast('Deleted '+r.name)}
 catch(e){toast('Could not delete: '+emsg(e))}}
async function addRow(){if(!ADM||!sb)return;const nm=normName(($('#anm')||{}).value),yg=+(($('#ayg')||{}).value);if(!nm||!(yg>=7&&yg<=11))return toast('Enter a name and a year group (7\u201311)');
 const b=gb();if(b.rows.some(r=>r.yg===yg&&r.name.toLowerCase()===nm.toLowerCase()))return toast('That student already exists in Year '+yg);
 try{const{data,error}=await sb.from('student_points').insert({student_name:nm,year_group:yg,ht2:0,ht3:0,ht4:0,ht5:0,ht6:0}).select(COLS);if(error)throw error;
  if(!data||data.length!==1)throw new Error('Supabase did not confirm the new record');b.rows.push(fromDB(data[0]));b._rj=JSON.stringify(b.rows);render();toast('Added '+nm)}
 catch(e){toast('Could not add: '+emsg(e))}}
async function bulkDb(kind){if(!ADM||!sb)return;const b=gb(),n=b?b.rows.length:0;if(!n)return toast('No students to change');
 const w=kind==='zero'?'ZERO':'DELETE',a=prompt(`This permanently ${kind==='zero'?'sets HT2\u2013HT6 to 0 for':'deletes'} all ${n} students in Supabase.\nType ${w} to confirm.`);if(a!==w)return toast('Cancelled');
 try{const q=sb.from('student_points'),{data,error}=kind==='zero'?await q.update({ht2:0,ht3:0,ht4:0,ht5:0,ht6:0}).gte('id',0).select('id'):await q.delete().gte('id',0).select('id');
  if(error)throw error;await refreshNow();toast((kind==='zero'?'Zeroed ':'Deleted ')+(data?data.length:0)+' students')}
 catch(e){try{await refreshNow()}catch(_){}toast('Failed: '+emsg(e))}}
function startPoll(){if(PT||!SES||!sb)return;PT=setInterval(pollOnce,5000);pollOnce()}
function stopPoll(){if(PT){clearInterval(PT);PT=null}PEP++;PIF=false}
async function pollOnce(){if(PIF||!SES||!sb||document.hidden)return;PIF=true;const ep=PEP;
 try{const[a,r]=await Promise.allSettled([sb.from('rankforge_settings').select('settings').eq('id','global').maybeSingle(),loadRows()]);
  if(ep!==PEP||!SES)return;
  const sOK=a.status==='fulfilled'&&!a.value.error,rOK=r.status==='fulfilled';
  if(!sOK&&!rOK)throw (a.status==='rejected'?a.reason:a.value.error)||r.reason||new Error('poll failed');
  if(sOK)applySettings(a.value.data?.settings);if(rOK)applyRows(r.value);
  PFAIL=0;if(!rtLive&&PT)setRT('poll')}
 catch(e){if(ep!==PEP)return;PFAIL++;dbg('Polling failed','',e);if(!rtLive&&PFAIL>=2)setRT('down');
  sb.auth.getSession().then(x=>{if(!x.data.session&&SES)authChanged('SIGNED_OUT',null)}).catch(()=>{})}
 finally{if(ep===PEP)PIF=false}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&PT)pollOnce()});
function rowsSoon(){clearTimeout(rT);rT=setTimeout(async()=>{try{if(!SES)return;const ep=SEP,rows=await loadRows();if(ep!==SEP||!SES)return;applyRows(rows)}catch(e){}},400)}
function initAuth(){if(!keyOK()){AUTHR=true;render();return}
 sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 sb.auth.onAuthStateChange((ev,ses)=>setTimeout(()=>authChanged(ev,ses),0))}
render();initAuth();
</script></body></html>
